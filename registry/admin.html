<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1016">
<meta name="robots" content="noindex,nofollow">
<title>pic registry 后台管理</title>
<style>
:root{
  --bg:#0b1016;
  --panel:#141d27;
  --panel-2:#182331;
  --line:rgba(126,152,182,.22);
  --line-strong:rgba(126,152,182,.42);
  --text:#e8eef6;
  --muted:#93a2b5;
  --cyan:#38bdf8;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#f87171;
  --radius:clamp(.75rem,1.4vw,1rem);
  --pad:clamp(.8rem,2vw,1.2rem);
  --gap:clamp(.6rem,1.4vw,1rem);
  --fs:clamp(.875rem,.82rem + .22vw,.95rem);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(70rem 40rem at 15% -10%,rgba(56,189,248,.14),transparent 60%),
    radial-gradient(50rem 30rem at 110% 8%,rgba(34,211,238,.08),transparent 60%);
  background-attachment:fixed;
  font:var(--fs)/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
a{color:var(--cyan);text-decoration:none;overflow-wrap:anywhere}
a:hover{text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:.82em}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem var(--gap);
  padding:calc(.6rem + env(safe-area-inset-top)) clamp(.7rem,3vw,1.5rem) .6rem;
  border-bottom:1px solid var(--line);
  background:rgba(11,16,22,.8);backdrop-filter:blur(12px) saturate(1.1);
}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;font-weight:700;font-size:clamp(1rem,.92rem + .4vw,1.15rem);letter-spacing:.01em}
.brand .dot{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--cyan);box-shadow:0 0 .8rem var(--cyan)}
.brand small{display:block;font-size:.68em;font-weight:400;letter-spacing:.05em;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:.5rem;min-width:0}
.chip{display:inline-flex;align-items:center;max-width:min(46vw,17rem);padding:.26rem .6rem;border:1px solid var(--line);border-radius:999rem;background:rgba(255,255,255,.03);color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.chip.bad{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}

/* ---------- 基础组件 ---------- */
.shell{width:100%;max-width:76rem;margin:0 auto;padding:var(--gap) clamp(.7rem,3vw,1.5rem) calc(2.4rem + env(safe-area-inset-bottom))}
.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);box-shadow:0 .5rem 2rem rgba(0,0,0,.22)}
input,select,button{font:inherit}
input,select{
  width:100%;min-width:0;color:var(--text);background:#0a1017;
  border:1px solid var(--line-strong);border-radius:.6rem;padding:.6rem .7rem;outline:none;
  font-size:1rem;
}
input:focus-visible,select:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 .18rem rgba(56,189,248,.18)}
button{
  color:var(--text);background:#223042;border:1px solid #33465b;border-radius:.6rem;
  padding:.55rem .85rem;cursor:pointer;white-space:nowrap;
  transition:filter .15s ease,border-color .15s ease,background .15s ease;
}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,#0284c7,#06b6d4);border-color:transparent;color:#031018;font-weight:700}
button.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#fecaca}
button.ghost{background:transparent;border-color:var(--line-strong);color:var(--muted)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (hover:none){button{padding:.7rem .9rem}}

/* ---------- 访问令牌 ---------- */
.auth{padding:0;overflow:hidden}
.auth summary{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:.7rem var(--pad);cursor:pointer;list-style:none;
}
.auth summary::-webkit-details-marker{display:none}
.auth summary .title{display:flex;align-items:center;gap:.5rem;font-weight:600}
.auth .chev{color:var(--muted);transition:transform .2s ease}
.auth[open] .chev{transform:rotate(180deg)}
.auth-body{display:grid;gap:.6rem;padding:0 var(--pad) var(--pad)}
.auth-row{display:flex;flex-wrap:wrap;gap:.5rem}
.auth-row input{flex:1 1 13rem}
.auth .hint{margin:0;color:var(--muted);font-size:.8em}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.5rem),1fr));gap:var(--gap);margin:var(--gap) 0}
.stat{padding:calc(var(--pad) * .8);background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius)}
.stat .k{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{margin-top:.1rem;font-size:clamp(1.3rem,1.05rem + 1vw,1.85rem);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}

/* ---------- 主区域 ---------- */
.board{display:grid;grid-template-columns:1fr;gap:var(--gap);align-items:start}
@media (min-width:60rem){
  .board{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
  .detail-panel{position:sticky;top:5.25rem;max-height:calc(100dvh - 6.25rem);overflow:auto;overscroll-behavior:contain}
}

/* ---------- 包列表 ---------- */
.list-head{display:grid;gap:.55rem;margin-bottom:.8rem}
.search-row{display:flex;gap:.5rem}
.search-row input{flex:1}
.filter-row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.filter-row select{flex:1 1 7rem}
.filter-row .count{flex-basis:100%;color:var(--muted);font-size:.8em}
.pkg-list{display:grid;gap:.55rem}
.pkg{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.35rem .9rem;align-items:center;
  width:100%;text-align:left;padding:.7rem .8rem;border:1px solid var(--line);border-radius:.7rem;
  background:rgba(255,255,255,.025);color:var(--text);cursor:pointer;white-space:normal;
}
.pkg:hover{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.06)}
.pkg.is-active{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.pkg-main{display:grid;gap:.15rem;min-width:0}
.pkg-name{font-weight:600;font-size:1.02em;overflow-wrap:anywhere}
.pkg-desc{color:var(--muted);font-size:.84em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pkg-meta{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;justify-content:flex-end}
.meta-item{color:var(--muted);font-size:.8em;white-space:nowrap}
.meta-item b{color:var(--text);font-weight:600}
@media (max-width:52rem){
  .pkg{grid-template-columns:1fr}
  .pkg-meta{justify-content:flex-start}
}

/* ---------- 标签 ---------- */
.pill{display:inline-flex;align-items:center;padding:.1rem .45rem;border:1px solid var(--line);border-radius:999rem;background:rgba(255,255,255,.03);color:var(--muted);font-size:.72em;white-space:nowrap}
.pill.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.1)}
.pill.warn{color:var(--yellow);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1)}
.pill.bad{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.1)}

/* ---------- 详情 ---------- */
.detail-panel{display:grid;gap:.85rem;min-height:11rem}
.detail-top{display:flex;align-items:center;gap:.5rem}
.detail-top .grow{flex:1}
.detail-title{font-size:clamp(1.08rem,.98rem + .55vw,1.4rem);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.detail-sub{color:var(--muted);font-size:.82em}
.back{display:none}
@media (max-width:59.99rem){
  .back{display:inline-flex}
  body.detail-open .list-panel{display:none}
}
.kv{display:grid;grid-template-columns:minmax(4.5rem,min(38%,8rem)) minmax(0,1fr);gap:.4rem .9rem;margin:0}
.kv dt{color:var(--muted);font-size:.82em}
.kv dd{margin:0;overflow-wrap:anywhere}
h4{margin:.3rem 0 0;font-size:1em}
.versions{display:grid;gap:.55rem}
.ver{display:grid;gap:.55rem;border:1px solid var(--line);border-radius:.7rem;padding:.7rem .8rem;background:rgba(255,255,255,.02)}
.ver-head{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .55rem}
.ver-head b{font-size:1.02em}
.ver-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:.45rem .9rem}
.cell{display:grid;gap:.08rem;min-width:0}
.cell .k{color:var(--muted);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}
.cell .v{font-size:.88em;overflow-wrap:anywhere}
.cell .sub{color:var(--muted);font-size:.78em;overflow-wrap:anywhere}
.ver-actions{display:flex;flex-wrap:wrap;gap:.45rem}
.ver-actions button{font-size:.88em}

/* ---------- 状态 ---------- */
.state{display:grid;place-items:center;gap:.25rem;padding:2.2rem 1rem;text-align:center;color:var(--muted)}
.state .big{color:var(--text);font-size:1.02em}

footer{color:var(--muted);text-align:center;font-size:.78rem;padding:1.6rem .2rem 0}
footer .sep{padding:0 .35em;opacity:.5}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:40;
  max-width:min(30rem,calc(100vw - 1.6rem));padding:.7rem .95rem;border-radius:.7rem;
  background:#16212c;border:1px solid var(--line);box-shadow:0 .8rem 2.4rem rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transform:translate(-50%,.6rem);
  transition:opacity .2s ease,transform .2s ease;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(52,211,153,.45)}
.toast.err{border-color:rgba(248,113,113,.5)}
@media (min-width:60rem){
  .toast{left:auto;right:1.2rem;max-width:26rem;transform:translateY(.6rem);text-align:left}
  .toast.show{transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span>pic registry<small>后台管理</small></span>
  </div>
  <div class="top-actions">
    <span id="who" class="chip">未登录 · 只读</span>
    <button type="button" class="ghost" id="refresh">刷新</button>
  </div>
</header>

<main class="shell">
  <details class="card auth" id="auth">
    <summary>
      <span class="title">访问令牌</span>
      <span class="row">
        <span id="token-state" class="chip">未保存</span>
        <span class="chev">▾</span>
      </span>
    </summary>
    <form class="auth-body" id="auth-form">
      <div class="auth-row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Cdifit AccessToken（pic admin 可自动填入）">
        <button type="submit" class="primary">保存</button>
        <button type="button" class="ghost" id="clear-token">清除</button>
      </div>
      <p class="hint">令牌只保存在本机浏览器；搜索与读取公开，撤回、删除、设置 latest 需要发布者或管理员。</p>
    </form>
  </details>

  <section class="stats" id="stats" aria-live="polite">
    <div class="stat"><div class="k">状态</div><div class="v">加载中…</div></div>
  </section>

  <div class="board">
    <section class="card list-panel" aria-label="包列表">
      <div class="list-head">
        <div class="search-row">
          <input id="q" type="search" autocomplete="off" placeholder="搜索包名 / 仓库 / 描述 / 关键词">
          <button type="button" class="primary" id="search">搜索</button>
        </div>
        <div class="filter-row">
          <select id="sort" aria-label="排序">
            <option value="">相关度</option>
            <option value="name">名称</option>
            <option value="latest">最新版本</option>
            <option value="updated">更新时间</option>
            <option value="downloads">下载量</option>
            <option value="versions">版本数</option>
          </select>
          <select id="order" aria-label="顺序">
            <option value="desc">降序</option>
            <option value="asc">升序</option>
          </select>
          <span class="count" id="package-count"></span>
        </div>
      </div>
      <div class="pkg-list" id="packages">
        <div class="state"><span class="big">加载中…</span></div>
      </div>
    </section>

    <aside class="card detail-panel" id="detail" aria-label="包详情">
      <div class="state">
        <span class="big">选择一个包</span>
        <span>点击列表中的包名，查看版本、发布者与制品信息</span>
      </div>
    </aside>
  </div>

  <footer>
    package.codecin.org.cn
    <span class="sep">·</span>/api/v1
    <span class="sep">·</span><a href="/api/v1/health">health</a>
  </footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const TOKEN_KEY = 'pic_admin_token';
const MOBILE_QUERY = '(max-width: 59.99rem)';

const API_BASE = (() => {
  const qs = new URLSearchParams(location.search);
  const override = qs.get('api');
  if (override) return override.replace(/\/+$/, '');
  if (location.protocol === 'file:') return 'https://package.codecin.org.cn/api/v1';
  return '/api/v1';
})();

let token = '';
let packages = [];
let current = null;

const $ = (id) => document.getElementById(id);
const isMobile = () => matchMedia(MOBILE_QUERY).matches;

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u){
  if (!u) return '';
  try{
    const x = new URL(String(u), location.href);
    return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
  }catch(e){ return ''; }
}
function bytes(n){
  let v = Number(n || 0);
  const units = ['B','KiB','MiB','GiB','TiB'];
  let i = 0;
  while (v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
  return (i ? v.toFixed(1) : String(v)) + ' ' + units[i];
}
function date(v){
  if (!v || String(v).startsWith('0001')) return '-';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function toast(msg, ok = true){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, 3200);
}

async function api(path, options = {}){
  const headers = new Headers(options.headers || {});
  headers.set('Accept', 'application/json');
  if (token) headers.set('Authorization', 'Bearer ' + token);
  if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
  const resp = await fetch(API_BASE + path, Object.assign({}, options, { headers, cache: 'no-store' }));
  let data = {};
  try { data = await resp.json(); } catch (e) {}
  if (!resp.ok || data.ok === false){
    const err = (data.error && data.error.message) || ('HTTP ' + resp.status);
    throw new Error(err);
  }
  return data.data;
}

function setToken(value){
  token = value.trim();
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
  $('token').value = token;
  updateWho();
}
async function updateWho(){
  const who = $('who'), state = $('token-state');
  if (!token){
    who.textContent = '未登录 · 只读';
    who.className = 'chip';
    state.textContent = '未保存';
    return;
  }
  who.textContent = '校验中…';
  who.className = 'chip';
  try{
    const me = await api('/me');
    const label = me.nickname || me.name || me.email || me.sub || '已登录';
    who.textContent = label + (me.admin ? ' · 管理员' : '');
    who.className = 'chip ok';
    state.textContent = '已保存';
  }catch(e){
    who.textContent = '令牌无效或已过期';
    who.className = 'chip bad';
    state.textContent = '无效';
  }
}

async function loadStats(){
  try{
    const s = await api('/stats');
    const items = [
      ['包', s.packages], ['版本', s.versions], ['制品', s.artifacts],
      ['已撤回', s.yanked], ['下载', s.downloads], ['存储', bytes(s.storage_bytes)]
    ];
    $('stats').innerHTML = items.map(([k, v]) =>
      '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>'
    ).join('');
  }catch(e){
    $('stats').innerHTML = '<div class="stat"><div class="k">统计</div><div class="v">加载失败</div></div>';
  }
}

async function loadPackages(){
  const q = $('q').value.trim(), sort = $('sort').value, order = $('order').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (sort){ params.set('sort', sort); params.set('order', order); }
  params.set('limit', '100');
  $('package-count').textContent = '加载中…';
  $('packages').innerHTML = '<div class="state"><span class="big">加载中…</span></div>';
  try{
    const data = await api('/packages?' + params.toString());
    packages = data.packages || [];
    $('package-count').textContent = '共 ' + data.total + ' 个包' + (data.total > packages.length ? ' · 显示前 ' + packages.length + ' 个' : '');
    if (!packages.length){
      $('packages').innerHTML = '<div class="state"><span class="big">没有匹配的包</span><span>换个关键字试试</span></div>';
      return;
    }
    $('packages').innerHTML = packages.map(p => {
      const badge = p.latest
        ? '<span class="pill ok">' + esc(p.latest) + '</span>'
        : '<span class="pill warn">无可用版本</span>';
      return '<button type="button" class="pkg" data-name="' + esc(p.name) + '" aria-label="查看 ' + esc(p.name) + '">'
        + '<span class="pkg-main">'
        +   '<span class="pkg-name">' + esc(p.name) + '</span>'
        +   (p.description ? '<span class="pkg-desc">' + esc(p.description) + '</span>' : '')
        + '</span>'
        + '<span class="pkg-meta">'
        +   badge
        +   '<span class="meta-item"><b>' + esc(p.versions) + '</b> 版本</span>'
        +   '<span class="meta-item"><b>' + esc(p.downloads || 0) + '</b> 下载</span>'
        +   '<span class="meta-item">' + esc(date(p.updated_at)) + '</span>'
        + '</span>'
        + '</button>';
    }).join('');
    if (current) markActive(current.name);
  }catch(e){
    $('package-count').textContent = '';
    $('packages').innerHTML = '<div class="state"><span class="big">加载失败</span><span>' + esc(e.message) + '</span></div>';
  }
}

function markActive(name){
  document.querySelectorAll('#packages .pkg').forEach(el => {
    el.classList.toggle('is-active', el.dataset.name === name);
  });
}

function selectPackage(name){
  markActive(name);
  if (isMobile()){
    document.body.classList.add('detail-open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  loadDetail(name);
}

function closeDetailView(){
  current = null;
  document.body.classList.remove('detail-open');
  document.querySelectorAll('#packages .pkg').forEach(el => el.classList.remove('is-active'));
  renderPlaceholder();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPlaceholder(){
  $('detail').innerHTML = '<div class="state"><span class="big">选择一个包</span><span>点击列表中的包名，查看版本、发布者与制品信息</span></div>';
}

async function loadDetail(name){
  $('detail').innerHTML = '<div class="state"><span class="big">' + esc(name) + '</span><span>加载中…</span></div>';
  try{
    const pkg = await api('/packages/' + encodeURIComponent(name));
    current = pkg;
    renderDetail(pkg);
  }catch(e){
    $('detail').innerHTML = '<div class="state"><span class="big">' + esc(name) + '</span><span>加载失败：' + esc(e.message) + '</span></div>';
  }
}

function renderDetail(p){
  const versions = Object.keys(p.versions || {}).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
  const repoUrl = safeUrl(p.repo);
  const homeUrl = safeUrl(p.homepage);
  const rows = versions.map(v => {
    const e = p.versions[v] || {};
    const yanked = !!e.yanked;
    const isLatest = p.latest === v;
    return '<article class="ver">'
      + '<div class="ver-head"><b>' + esc(v) + '</b>'
      +   (isLatest ? '<span class="pill ok">latest</span>' : '')
      +   (yanked ? '<span class="pill bad">已撤回</span>' : '')
      + '</div>'
      + '<div class="ver-grid">'
      +   '<div class="cell"><span class="k">标签 / 提交</span><span class="v">' + esc(e.tag || '-') + '</span><span class="sub">' + esc((e.rev || '').slice(0, 12) || '-') + '</span></div>'
      +   '<div class="cell"><span class="k">制品</span><span class="v">' + esc(bytes(e.archive_size)) + '</span><span class="sub">' + esc((e.archive_sha256 || '').slice(0, 12) || '无制品') + '</span></div>'
      +   '<div class="cell"><span class="k">下载</span><span class="v">' + esc(e.downloads || 0) + '</span></div>'
      +   '<div class="cell"><span class="k">发布</span><span class="v">' + esc(date(e.published_at)) + '</span><span class="sub">' + esc((e.publisher && (e.publisher.email || e.publisher.nickname)) || '-') + '</span></div>'
      + '</div>'
      + '<div class="ver-actions">'
      +   '<button type="button" data-act="yank" data-v="' + esc(v) + '" data-y="' + (yanked ? '0' : '1') + '">' + (yanked ? '恢复' : '撤回') + '</button>'
      +   '<button type="button" data-act="latest" data-v="' + esc(v) + '"' + (isLatest ? ' disabled' : '') + '>设为 latest</button>'
      +   '<button type="button" class="danger" data-act="delver" data-v="' + esc(v) + '">删除</button>'
      + '</div>'
      + '</article>';
  }).join('');

  $('detail').innerHTML =
      '<div class="detail-top">'
    +   '<button type="button" class="ghost back" data-back>← 返回</button>'
    +   '<span class="grow"></span>'
    +   '<button type="button" class="danger" data-delpkg>删除整个包</button>'
    + '</div>'
    + '<div>'
    +   '<div class="detail-title">' + esc(p.name) + '</div>'
    +   '<div class="detail-sub">' + esc(p.downloads || 0) + ' 下载 · ' + esc(versions.length) + ' 个版本 · 更新于 ' + esc(date(p.updated_at)) + '</div>'
    + '</div>'
    + '<dl class="kv">'
    +   '<dt>最新</dt><dd>' + (p.latest ? '<span class="pill ok">' + esc(p.latest) + '</span>' : '<span class="pill warn">无</span>') + '</dd>'
    +   '<dt>Git 仓库</dt><dd>' + (repoUrl ? '<a href="' + esc(repoUrl) + '" target="_blank" rel="noreferrer">' + esc(p.repo) + '</a>' : '-') + '</dd>'
    +   '<dt>描述</dt><dd>' + esc(p.description || '-') + '</dd>'
    +   '<dt>关键词</dt><dd>' + esc((p.keywords || []).join(', ') || '-') + '</dd>'
    +   '<dt>许可证</dt><dd>' + esc(p.license || '-') + '</dd>'
    +   '<dt>主页</dt><dd>' + (homeUrl ? '<a href="' + esc(homeUrl) + '" target="_blank" rel="noreferrer">' + esc(p.homepage) + '</a>' : esc(p.homepage || '-')) + '</dd>'
    +   '<dt>入口</dt><dd>' + esc(p.entry || '-') + '</dd>'
    +   '<dt>模块</dt><dd>' + esc((p.modules || []).join(', ') || '-') + '</dd>'
    +   '<dt>更新时间</dt><dd>' + esc(date(p.updated_at)) + '</dd>'
    + '</dl>'
    + '<h4>版本 <span class="muted small">(' + esc(versions.length) + ')</span></h4>'
    + (rows ? '<div class="versions">' + rows + '</div>'
            : '<div class="state"><span>暂无版本</span></div>');
}

async function versionAction(act, version, yanked){
  if (!token){ toast('先保存 Cdifit AccessToken', false); return; }
  const name = current && current.name;
  if (!name) return;
  try{
    if (act === 'yank'){
      if (!confirm((yanked ? '撤回 ' : '恢复 ') + name + '@' + version + ' ?')) return;
      await api('/packages/' + encodeURIComponent(name) + '/' + encodeURIComponent(version) + '/yank',
        { method: 'POST', body: JSON.stringify({ yanked: yanked }) });
      toast((yanked ? '已撤回 ' : '已恢复 ') + version);
    }else if (act === 'latest'){
      await api('/packages/' + encodeURIComponent(name) + '/' + encodeURIComponent(version) + '/latest',
        { method: 'POST', body: JSON.stringify({ latest: true }) });
      toast('latest 已指向 ' + version);
    }else if (act === 'delver'){
      if (!confirm('删除 ' + name + '@' + version + ' 及其制品？此操作不可恢复。')) return;
      await api('/packages/' + encodeURIComponent(name) + '/' + encodeURIComponent(version), { method: 'DELETE' });
      toast('已删除 ' + version);
    }
    await Promise.all([loadDetail(name), loadPackages(), loadStats()]);
  }catch(e){
    toast(e.message, false);
  }
}

async function deletePackage(){
  if (!token){ toast('先保存 Cdifit AccessToken', false); return; }
  const name = current && current.name;
  if (!name) return;
  if (!confirm('删除整个包 ' + name + '（全部版本与制品）？此操作不可恢复。')) return;
  try{
    await api('/packages/' + encodeURIComponent(name), { method: 'DELETE' });
    toast('已删除 ' + name);
    closeDetailView();
    await Promise.all([loadPackages(), loadStats()]);
  }catch(e){
    toast(e.message, false);
  }
}

/* ---------- 事件绑定 ---------- */
$('auth-form').addEventListener('submit', (e) => {
  e.preventDefault();
  setToken($('token').value);
  toast(token ? '令牌已保存' : '令牌已清除');
  loadStats();
  loadPackages();
  if (current) loadDetail(current.name);
});
$('clear-token').addEventListener('click', () => {
  setToken('');
  toast('令牌已清除');
});
$('search').addEventListener('click', loadPackages);
$('sort').addEventListener('change', loadPackages);
$('order').addEventListener('change', loadPackages);
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){ e.preventDefault(); loadPackages(); }
});
let searchTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadPackages, 350);
});
$('packages').addEventListener('click', (e) => {
  const el = e.target.closest('.pkg');
  if (el) selectPackage(el.dataset.name);
});
$('detail').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.hasAttribute('data-back')){ closeDetailView(); return; }
  if (btn.hasAttribute('data-delpkg')){ deletePackage(); return; }
  if (btn.dataset.act){ versionAction(btn.dataset.act, btn.dataset.v, btn.dataset.y === '1'); }
});
$('refresh').addEventListener('click', async () => {
  await Promise.all([
    loadStats(),
    loadPackages(),
    current ? loadDetail(current.name) : Promise.resolve()
  ]);
  toast('已刷新');
});

/* ---------- 初始化 ---------- */
(function init(){
  try{
    const hash = new URLSearchParams(location.hash.slice(1));
    const qs = new URLSearchParams(location.search);
    const incoming = hash.get('token') || qs.get('token');
    if (incoming){
      setToken(incoming);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
  token = localStorage.getItem(TOKEN_KEY) || '';
  $('token').value = token;
  if (token && isMobile()) $('auth').open = false;
  updateWho();
  loadStats();
  loadPackages();
})();
</script>

[project]
name = "codecin"
version = "5.4.2"
description = "Code CIN - 高级语言与运行时 (CIN/PL/ASM 工具链 + Go 原生 VM + ARM64/RISC-V/FP/Vector 指令集)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "ByUsi Studio" },
    { name = "北啊呢" },
]
keywords = ["simulator", "emulator", "assembler", "compiler"]
dependencies = [
    "rich>=13,<15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

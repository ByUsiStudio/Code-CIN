[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecin"
dynamic = ["version"]
description = "Code CIN - 高级语言与运行时 (CIN/PL/ASM 工具链 + Go 原生 VM + ARM64/RISC-V/FP/Vector 指令集)"
readme = "README.md"
requires-python = ">=3.8"
# SPDX 表达式写法; 旧的 `license = { text = "MIT" }` 表格形式已被弃用,
# 2027-02 起将不再受支持 (需要 setuptools>=77)。
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ByUsi Studio" },
    { name = "北啊呢" },
]
keywords = ["simulator", "emulator", "assembler", "compiler"]
dependencies = [
    "rich>=13,<15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]

[project.scripts]
codecin = "codecin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codecin*"]
exclude = ["tests*", "docs*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "codecin.__version__" }

[tool.setuptools.package-data]
# 内置标准库 (codecin/lib/*.cin) 必须随包分发, 否则安装后 `import "math.cin"` 会失败。
#
# 原生库 (*.dll / *.so / *.dylib) **刻意不打包**: 它是构建产物, 由用户安装时的
# setup.py 在本地编译 (见 setup.py: BuildPyWithNative), 预编译好的库只作为
# Release 资产按平台/架构分发。
"codecin"        = ["py.typed", "lib/*.cin", "lib/**/*.cin"]
"codecin.lib"    = ["*.cin"]
"codecin.native" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecin"
dynamic = ["version"]
description = "Code CIN - 高级语言与运行时 (CIN/PL/ASM 工具链 + Go 原生 VM + ARM64/RISC-V/FP/Vector 指令集)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "ByUsi Studio" },
    { name = "北啊呢" },
]
keywords = ["simulator", "emulator", "assembler", "compiler"]
dependencies = [
    "rich>=13,<15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]

[project.scripts]
codecin = "codecin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codecin*"]
exclude = ["tests*", "docs*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "codecin.__version__" }

[tool.setuptools.package-data]
# 内置标准库 (codecin/lib/*.cin) 必须随包分发, 否则安装后 `import "math.cin"` 会失败
"codecin"        = ["*.dll", "*.so", "*.dylib", "py.typed", "lib/*.cin", "lib/**/*.cin"]
"codecin.lib"    = ["*.cin"]
"codecin.native" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
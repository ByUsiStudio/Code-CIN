name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/ 是官方文档站子仓库 (Code-CIN-Docs), ISA 文档一致性检查依赖它
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ISA/文档一致性检查
        run: python script/gen_isa_docs.py --check
      - name: Native ISA 生成一致性检查
        run: python script/gen_native_isa.py --check
      - name: Run tests
        run: python -m pytest
      - name: 检测被 .gitignore 意外吞掉的源码
        run: |
          # 只列被忽略的"文件"(git ls-files 不列目录), 并排除有意忽略的临时/构建路径。
          leaks=$(git ls-files --others --ignored --exclude-standard -- '*.py' '*.go' '*.cin' '*.asm' \
            | grep -vE '^(\.tmp|dist/|build/)' || true)
          if [ -n "$leaks" ]; then
            echo "以下源码/样例被 .gitignore 忽略, 不会被提交:" >&2
            echo "$leaks" >&2
            exit 1
          fi

  integration:
    name: 原生/Go 集成 (真实跑原生路径)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/ 是官方文档站子仓库 (Code-CIN-Docs), ISA 文档一致性检查依赖它
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
          cache: true
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build native shared library
        working-directory: codecin/native
        run: go build -buildmode=c-shared -o ../libcodecin_native.so .
      - name: 断言原生库确实可加载 (否则 native 用例会静默 skip)
        run: |
          python -c "from codecin import native; assert native.get_engine() is not None, \
          'native library failed to load'"
      - name: Run tests (原生库已就绪, 带覆盖率门槛)
        run: |
          python -m pytest -rs \
            --cov=codecin --cov-report=term-missing --cov-fail-under=70
        env:
          CODECIN_AOT_TESTS: "1"

  dist:
    name: 打包 (wheel/sdist 必须含内置标准库)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/ 是官方文档站子仓库 (Code-CIN-Docs), ISA 文档一致性检查依赖它
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
          cache: true
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build sdist + 纯 Python wheel
        # PyPI 包不携带预编译原生库 (用户安装时用 Go 现场编译), 因此发布物用
        # CODECIN_SKIP_NATIVE=1 构建。
        env:
          CODECIN_SKIP_NATIVE: "1"
        run: python -m build
      - name: 断言含内置标准库, 且不含预编译原生库
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          libs = [n for n in names
                  if n.startswith('codecin/lib/') and n.endswith('.cin')]
          assert len(libs) >= 19, f'{whl} 缺少内置标准库: {libs}'
          bins = [n for n in names if n.endswith(('.so', '.dylib', '.dll'))]
          assert not bins, f'{whl} 不应携带预编译原生库: {bins}'
          print(f'{whl}: {len(libs)} 个内置标准库模块, 无预编译库')
          sdist = glob.glob('dist/*.tar.gz')[0]
          snames = tarfile.open(sdist).getnames()
          slibs = [n for n in snames
                   if '/codecin/lib/' in n and n.endswith('.cin')]
          assert len(slibs) >= 19, f'{sdist} 缺少内置标准库'
          sbins = [n for n in snames if n.endswith(('.so', '.dylib', '.dll'))]
          assert not sbins, f'{sdist} 不应携带预编译原生库: {sbins}'
          print(f'{sdist}: {len(slibs)} 个内置标准库模块, 无预编译库')
          PY
      - name: 装 wheel 后跑一个使用内置标准库的程序
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          printf 'import "str.cin"\nfunction main() -> int { println(strlen(s_repeat("ab", 3))) return 0 }\n' > libsmoke.cin
          /tmp/venv/bin/codecin libsmoke.cin --no-native

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/ 是官方文档站子仓库 (Code-CIN-Docs), ISA 文档一致性检查依赖它
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check codecin cpu.py script tests

  native:
    name: Go native (build check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/ 是官方文档站子仓库 (Code-CIN-Docs), ISA 文档一致性检查依赖它
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
          cache: true
      - name: Build all Go packages (Go 侧不含 CLI 入口)
        run: go build ./...
        working-directory: codecin/native
      - name: go vet
        run: go vet ./...
        working-directory: codecin/native
      - name: gofmt 检查 (生成物也必须是 gofmt 干净的 LF 文件)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化:" >&2
            echo "$out" >&2
            exit 1
          fi
        working-directory: codecin/native
      - name: go test (含竞态检测)
        run: go test ./... -race -count=1
        working-directory: codecin/native
      - name: 断言 Go 侧没有 CLI 入口
        run: |
          # 唯一的 package main 必须是与 Python 共享的 c-shared 库入口 main.go;
          # 任何额外的 main 包都意味着 Go 侧又长出了 CLI。
          extra=$(grep -rl '^package main' --include='*.go' . | grep -v '^\./main\.go$' || true)
          if [ -n "$extra" ]; then
            echo "Go 侧不允许存在 CLI 入口 (package main), 除 ./main.go 外发现:" >&2
            echo "$extra" >&2
            exit 1
          fi
          grep -q '#include <stdlib.h>' main.go || {
            echo "./main.go 不再是 c-shared 库入口?" >&2; exit 1; }
        working-directory: codecin/native
      - name: Cross-compile check (linux/darwin/windows, pure-Go)
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build ./engine ./ir ./compiler ./aot
          done
        working-directory: codecin/native
      - name: Build c-shared (Linux)
        run: go build -buildmode=c-shared -o /tmp/libcodecin_native.so .
        working-directory: codecin/native

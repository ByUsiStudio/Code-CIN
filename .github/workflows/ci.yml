name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ISA/文档一致性检查
        run: python script/gen_isa_docs.py --check
      - name: Native ISA 生成一致性检查
        run: python script/gen_native_isa.py --check
      - name: Run tests
        run: python -m pytest
      - name: 检测被 .gitignore 意外吞掉的源码
        run: |
          # 只列被忽略的"文件"(git ls-files 不列目录), 并排除有意忽略的临时/调试路径。
          # tmpdump/ 是待删除的调试程序, 暂时豁免 (见 docs/SUGGESTIONS.md §2.4)。
          leaks=$(git ls-files --others --ignored --exclude-standard -- '*.py' '*.go' '*.cin' '*.asm' \
            | grep -vE '^(\.tmp|dist/|build/)' | grep -v '/tmpdump/' || true)
          if [ -n "$leaks" ]; then
            echo "以下源码/样例被 .gitignore 忽略, 不会被提交:" >&2
            echo "$leaks" >&2
            exit 1
          fi

  integration:
    name: 原生/Go 集成 (真实跑原生路径与差分)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
          cache: true
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build Go CLI
        working-directory: codecin/native
        run: go build -o codecin ./cmd/codecin
      - name: Build native shared library
        working-directory: codecin/native
        run: go build -buildmode=c-shared -o ../libcodecin_native.so .
      - name: 断言原生库确实可加载 (否则 native 用例会静默 skip)
        run: |
          python -c "from codecin import native; assert native.get_engine() is not None, \
          'native library failed to load'"
      - name: Run tests (原生与 Go CLI 均已就绪)
        run: python -m pytest -rs
        env:
          CODECIN_AOT_TESTS: "1"
      - name: 覆盖率报告 (门槛待基线确定后再设 --cov-fail-under)
        run: |
          python -m pip install pytest-cov
          python -m pytest -q --cov=codecin --cov-report=term-missing
      - name: Go/Python 编译器差分测试
        run: python script/diff_go_python.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check codecin cpu.py script tests

  native:
    name: Go native (build check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
          cache: true
      - name: Build all Go packages + CLI
        run: go build ./...
        working-directory: codecin/native
      - name: go vet
        run: go vet ./...
        working-directory: codecin/native
      - name: gofmt 检查 (生成物也必须是 gofmt 干净的 LF 文件)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化:" >&2
            echo "$out" >&2
            exit 1
          fi
        working-directory: codecin/native
      - name: go test (含竞态检测)
        run: go test ./... -race -count=1
        working-directory: codecin/native
      - name: Cross-compile check (linux/darwin/windows, pure-Go)
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build ./engine ./ir ./compiler ./cmd/codecin
          done
        working-directory: codecin/native
      - name: Build c-shared (Linux)
        run: go build -buildmode=c-shared -o /tmp/libcodecin_native.so .
        working-directory: codecin/native

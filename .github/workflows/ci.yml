name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ISA/文档一致性检查
        run: python script/gen_isa_docs.py --check
      - name: Native ISA 生成一致性检查
        run: python script/gen_native_isa.py --check
      - name: Run tests
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check codecin cpu.py script tests

  native:
    name: Go native (build check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: codecin/native/go.mod
      - name: Build all Go packages + CLI
        run: go build ./...
        working-directory: codecin/native
      - name: Cross-compile check (linux/darwin/windows, pure-Go)
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build ./engine ./ir ./compiler ./cmd/codecin
          done
        working-directory: codecin/native
      - name: Build c-shared (Linux)
        run: go build -buildmode=c-shared -o /tmp/libcodecin_native.so .
        working-directory: codecin/native

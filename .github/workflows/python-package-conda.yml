name: Conda 安装与测试

# 与 ci.yml 的区别: 这里专门验证「在 conda 环境里从源码 pip install」这条路径。
# 本仓库不使用 environment.yml / conda 包依赖: Python 依赖统一由
# requirements*.txt + pyproject.toml 管理, conda 只负责提供解释器与隔离环境。
# 原生引擎由 Go 编译 (setup.py 在 pip install 时调用 codecin/native/build.sh),
# 因此必须先装好 Go, 否则安装虽成功但程序无法执行 (v5.9.0 起无纯 Python 回退)。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conda-install:
    name: conda (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        # conda activate 依赖登录 shell, 这是 setup-miniconda 的推荐写法。
        shell: bash -el {0}
    steps:
      # 本仓库无子模块 (文档站已迁至独立仓库 Code-CIN-Docs), 不要加 submodules。
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: codecin
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-activate-base: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: codecin/native/go.mod
          cache: true
          # Go 模块在 codecin/native/ 下 (仓库根没有 go.mod), 不指定这一项时
          # setup-go 会在仓库根找不到依赖文件并跳过缓存。
          cache-dependency-path: codecin/native/go.mod
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 从源码安装 (触发原生库编译)
        run: python -m pip install .
      - name: 一致性检查
        run: |
          python script/gen_native_isa.py --check
          python script/sync_stdlib_packages.py --check
      - name: Lint (ruff, 项目统一使用 ruff 而非 flake8)
        run: ruff check codecin cpu.py script tests registry
      - name: 断言原生引擎确实可加载
        run: |
          python -c "from codecin import native; assert native.get_engine() is not None, \
          'native library failed to load'"
      - name: 安装产物冒烟 (脱离仓库目录, 用已安装的命令行)
        run: |
          codecin --version
          cd "$RUNNER_TEMP"
          printf 'function main() -> int { println("conda ok") return 0 }\n' > smoke.cin
          codecin smoke.cin
      - name: Run tests
        run: python -m pytest

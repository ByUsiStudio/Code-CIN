name: PyPI Packages

# 构建并发布 codecin 的平台专用 wheel 与 sdist 到 PyPI / TestPyPI。
#
# 与 release.yml 的区别:
#   * release.yml 产出 GitHub Release 资产 (原生库以独立文件附带平台后缀);
#   * 本工作流产出 *平台专用的 wheel*: 每个平台的 wheel 内部已打包对应架构的
#     预编译原生库, 用户 `pip install` 后无需安装 Go 即可直接运行。
#
# 平台覆盖:
#   * Windows x64
#   * macOS ARM64 (Apple Silicon) + x64 (Intel)
#   * Linux x64 + ARM64
#     (GitHub 托管的 Linux runner 仅原生提供这两种架构; 若需 i686/ppc64le/
#      s390x 等, 需用 QEMU + manylinux 容器另行扩展)
#
# 发布策略 (手动触发):
#   * PyPI / TestPyPI: 逐个文件上传, 已存在的文件自动跳过 (--skip-existing),
#     单个文件失败只记警告, 继续处理其余文件 (不会因为一个 400 中断整批);
#   * GitHub Release: 若最新 Release 的 tag 版本与本次构建版本一致, 则把含预编译
#     原生库的 wheel 逐个追加为 Release 资产; 同名资产不替换 (不加 --clobber),
#     单个失败只记警告。版本不一致时整体跳过。
#
# 触发条件: 仅手动触发 (workflow_dispatch)。
#   * registry: 发布目标 —— pypi (正式) / testpypi (发布前演练)。

on:
  workflow_dispatch:
    inputs:
      registry:
        description: '发布目标'
        required: true
        type: choice
        default: 'pypi'
        options:
          - 'pypi'
          - 'testpypi'

permissions:
  contents: read

# Windows runner 的 ANSI 代码页是 cp1252: Python 把 stdout 重定向到 Actions 日志
# 管道时默认按该代码页编码, 本工作流多处步骤会打印中文 (pic 结构校验、wheel 内容
# 校验), 不强制 UTF-8 就会抛 UnicodeEncodeError。这里统一开启 Python UTF-8 模式,
# 与 Linux/macOS runner 的默认行为保持一致。
env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: 构建平台 wheel (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 资产名 = wheel 平台标签 (plat-name), 必须与构建环境一致,
          # 否则 pip 会拒绝在不匹配的平台上安装。
          - os: windows-latest
            slug: windows-x64
            plat-name: win_amd64
          - os: macos-15
            slug: macos-arm64
            plat-name: macosx_11_0_arm64
          - os: macos-15-intel
            slug: macos-x64
            plat-name: macosx_11_0_x86_64
          - os: ubuntu-latest
            slug: linux-x64
            plat-name: manylinux_2_17_x86_64.manylinux2014_x86_64
          - os: ubuntu-24.04-arm
            slug: linux-arm64
            plat-name: manylinux_2_17_aarch64.manylinux2014_aarch64
    steps:
      # 本仓库无子模块 (文档站已迁至独立仓库 Code-CIN-Docs): 不要加 submodules。
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-go@v7
        with:
          go-version-file: codecin/native/go.mod
          cache: true
          # Go 模块在 codecin/native/ 下 (仓库根没有 go.mod), 不指定这一项时
          # setup-go 会在仓库根找不到依赖文件并跳过缓存。
          cache-dependency-path: codecin/native/go.mod

      # === 统一环境准备: GCC + Pip 包 (全平台一致) ===
      # 原生库通过 cgo 编译, 需要 C 编译器 (gcc/clang)。各平台安装方式不同,
      # 用 RUNNER_OS 分支统一在一个 bash 步骤里完成。
      - name: 安装 GCC (cgo 所需的 C 编译器)
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y gcc
              ;;
            macOS)
              # macOS runner 自带 Xcode CLT (clang), 但额外安装 gcc 以保持一致。
              brew install gcc
              ;;
            Windows)
              # Windows cgo 需要 MinGW-w64 的 gcc; choco 在 windows runner 上预装。
              choco install mingw -y --no-progress
              # MinGW 安装到 C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin
              echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "::error::不支持的操作系统: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          echo "--- 验证 gcc ---"
          gcc --version | head -1

      - name: 安装 Pip 包 (构建依赖 + 运行时依赖)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel build
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      # === 统一环境准备结束 ===

      - name: 校验内置标准库 pic 包结构
        run: python script/sync_stdlib_packages.py --check

      - name: 构建原生库
        shell: bash
        run: |
          cd codecin/native
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          else
            sh build.sh
          fi

      - name: 清理旧产物
        shell: bash
        run: rm -rf dist build *.egg-info

      - name: 构建 wheel (含预编译原生库)
        env:
          # 原生库已在上一步构建, 让 setup.py 的 build_py 直接复用,
          # 不再重复调用 go build。
          CODECIN_FORCE_REBUILD: "0"
        # 使用 python -m build (PEP 517) 而非已弃用的 setup.py bdist_wheel。
        # --no-isolation: 复用当前环境已安装的 setuptools/wheel, 加速构建。
        run: python -m build --wheel --no-isolation

      - name: 打上平台标签 (wheel tags)
        # python -m build 产出的是 py3-none-any 通用 wheel;
        # 这里用 wheel tags 把平台标签改成当前构建平台, 否则 pip 会在
        # 不匹配的平台上拒绝安装。--remove 删除原始通用 wheel。
        shell: bash
        run: |
          python -m wheel tags \
            --platform-tag ${{ matrix.plat-name }} \
            --python-tag py3 \
            --abi-tag none \
            --remove \
            dist/codecin-*.whl

      - name: 校验 wheel 内容 (标准库 + 原生库)
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          whl = sorted(glob.glob('dist/codecin-*.whl'))[-1]
          names = zipfile.ZipFile(whl).namelist()
          libs = [n for n in names
                  if n.startswith('codecin/lib/') and n.endswith('.cin')]
          bins = [n for n in names
                  if n.endswith(('.so', '.dylib', '.dll'))]
          print(f'wheel: {whl}')
          print(f'内置标准库模块: {len(libs)} 个')
          print(f'预编译原生库: {bins}')
          assert len(libs) >= 19, f'{whl} 缺少内置标准库'
          assert len(bins) == 1, \
              f'{whl} 应恰好含一个预编译原生库, 实际: {bins}'
          print('校验通过: 含内置标准库 + 预编译原生库')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.slug }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: 构建 sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 本仓库无子模块: 不要加 submodules。
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: 安装 Pip 包 (构建依赖 + 运行时依赖)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel build
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: 校验内置标准库 pic 包结构
        run: python script/sync_stdlib_packages.py --check

      - name: 清理旧产物
        run: rm -rf dist build *.egg-info

      - name: 构建 sdist (不含预编译原生库)
        # sdist 是源码包, 用户 `pip install` 时由 setup.py 现场编译原生库,
        # 因此这里不打包任何预编译库。
        env:
          CODECIN_SKIP_NATIVE: "1"
        run: python -m build --sdist

      - name: 校验 sdist 内容
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile

          sdist = sorted(glob.glob('dist/*.tar.gz'))[-1]
          names = tarfile.open(sdist).getnames()
          libs = [n for n in names
                  if '/codecin/lib/' in n and n.endswith('.cin')]
          bins = [n for n in names
                  if n.endswith(('.so', '.dylib', '.dll'))]
          print(f'sdist: {sdist}')
          print(f'内置标准库模块: {len(libs)} 个')
          assert len(libs) >= 19, f'{sdist} 缺少内置标准库'
          assert not bins, f'{sdist} 不应携带预编译原生库: {bins}'
          print('校验通过: 含内置标准库, 无预编译原生库')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: 发布 (${{ inputs.registry }})
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # gh release upload 需要写 Release 资产; download-artifact 读取本次运行的产物。
      contents: write
      actions: read
    steps:
      # 合并所有 wheel + sdist 到 dist/
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: 安装 twine
        run: python -m pip install --upgrade twine

      - name: twine 检查 (元数据完整性)
        run: python -m twine check dist/*

      - name: 发布到 PyPI / TestPyPI (逐个上传, 单个失败不中断)
        # 逐个文件上传: 任何单个文件失败 (例如服务端拒绝) 都不会中断其余文件。
        # --skip-existing: 版本已发布过时跳过同名文件, 让重跑幂等
        #   (PyPI 不允许复用文件名, 重跑只能跳过已存在的产物)。
        # --verbose: 失败时打印服务端响应正文, 便于定位 400 的具体原因。
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ "$REGISTRY" = "testpypi" ]; then
            repository_url="https://test.pypi.org/legacy/"
            token="$TESTPYPI_TOKEN"
          else
            repository_url=""
            token="$PYPI_TOKEN"
          fi

          if [ -n "$repository_url" ]; then
            upload=(python -m twine upload --skip-existing --verbose
                    --repository-url "$repository_url")
          else
            upload=(python -m twine upload --skip-existing --verbose)
          fi

          failed=0
          for file in dist/*; do
            echo "::group::上传 $(basename "$file")"
            if TWINE_USERNAME=__token__ TWINE_PASSWORD="$token" \
                "${upload[@]}" "$file"; then
              echo "成功 (或已存在已跳过): $(basename "$file")"
            else
              status=$?
              echo "::warning::上传失败 (退出码 $status): $(basename "$file")"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          echo "上传结束: 失败 $failed 个文件"
          if [ "$failed" -ne 0 ]; then
            # 已经尝试完全部文件; 这里仍标记失败, 避免真实错误被静默吞掉。
            echo "::error::$failed 个文件未能上传, 其余文件已尝试完毕"
            exit 1
          fi

      - name: 追加 wheel 到最新 GitHub Release (版本匹配才添加)
        # 只添加不替换: gh release upload 默认对同名资产报错, 不加 --clobber。
        # 报错不停止: 逐个上传, 单个失败只告警; 该步骤失败也不影响发布结果。
        # 版本核验: 最新 Release 的 tag 版本必须与 wheel 版本一致, 否则整体跳过。
        if: ${{ always() && inputs.registry == 'pypi' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # 从 wheel 文件名解析版本; 所有 wheel 必须同版本。
          version="$(python - <<'PY'
          import glob
          import os
          import sys

          from packaging.utils import parse_wheel_filename

          versions = {str(parse_wheel_filename(os.path.basename(path))[1])
                      for path in glob.glob('dist/*.whl')}
          if len(versions) != 1:
              print(f'::warning::无法唯一确定 wheel 版本: {sorted(versions)}',
                    file=sys.stderr)
              sys.exit(0)
          print(versions.pop())
          PY
          )"
          if [ -z "$version" ]; then
            echo "::warning::未找到可用 wheel, 跳过 Release 资产上传"
            exit 0
          fi

          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::warning::没有找到最新 Release, 跳过资产上传"
            exit 0
          fi

          release_version="${tag#v}"
          if [ "$release_version" != "$version" ]; then
            echo "::warning::最新 Release ($tag) 与包版本 ($version) 不一致, 不添加资产"
            exit 0
          fi

          for wheel in dist/*.whl; do
            if gh release upload "$tag" "$wheel"; then
              echo "已添加到 Release $tag: $(basename "$wheel")"
            else
              echo "::warning::Release 资产添加失败 (可能已存在): $(basename "$wheel")"
            fi
          done
